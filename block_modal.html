<div class="modal-panel owned-modal" data-properties-surface="modal" role="dialog" aria-modal="true" aria-labelledby="{{ node_id }}-modal-title" data-generic-block-modal-root data-block-runtime-refresh="autonomous" data-node-id="{{ node_id }}" data-node-kind="industrial_read">
  <header class="modal-header"><div><span class="panel-kicker" data-i18n="block.industrial_read.role">Read-only industrial telemetry</span><h2 id="{{ node_id }}-modal-title">{{ node_title }}</h2></div><button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.close">Close</button></header>
  <div class="owned-body">
    <p class="field-hint" data-i18n="block.industrial_read.workflow">Read configured points only. Values become unknown after an error or expiry; this block never commands equipment.</p>
    <div class="field-group"><label for="{{ node_id }}-modal-name" data-i18n="ui.block_kit.node_name">Node name</label><input id="{{ node_id }}-modal-name" data-block-title-field type="text" value="{{ node_title }}"></div>
    {{ settings }}
    <details class="owned-advanced"><summary data-i18n="block.industrial_read.last_state">Last result</summary>{{ runtime_html }}</details>
  </div>
  <footer class="owned-footer"><p class="field-hint" data-i18n="block.industrial_read.apply_hint">Changes remain local until Apply. Restart a loaded Run to use new settings.</p><div class="modal-actions"><button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.cancel">Cancel</button><button class="solid-btn" data-owned-apply data-block-mutation-control type="button" disabled data-i18n="ui.block_kit.apply">Apply</button></div></footer>
</div>
